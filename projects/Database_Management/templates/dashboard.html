<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Technology Selection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="./css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-mount"></div>
    <div class="main-area">
      <div id="topbar-mount"></div>
      <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <h4 class="fw-bold mb-0">Database Technology Selection</h4>
            <p class="text-muted small mb-0">Choose a database module to view its inventory and monitoring dashboard.</p>
          </div>
        </div>

        <div class="db-grid">
          <a href="./mongodb_inventory.html" class="db-card active text-decoration-none">
            <div class="db-icon" style="background:#dcfce7;color:#16a34a;"><i class="bi bi-database-fill"></i></div>
            <div class="db-name">MongoDB</div>
            <span class="db-status active">Active</span>
          </a>
          <div class="db-card text-decoration-none opacity-75">
            <div class="db-icon" style="background:#dbeafe;color:#2563eb;"><i class="bi bi-database"></i></div>
            <div class="db-name">Microsoft SQL Server</div>
            <span class="db-status planned">Planned</span>
          </div>
          <div class="db-card text-decoration-none opacity-75">
            <div class="db-icon" style="background:#fef3c7;color:#d97706;"><i class="bi bi-database"></i></div>
            <div class="db-name">MySQL</div>
            <span class="db-status planned">Planned</span>
          </div>
          <div class="db-card text-decoration-none opacity-75">
            <div class="db-icon" style="background:#ede9fe;color:#7c3aed;"><i class="bi bi-database"></i></div>
            <div class="db-name">MariaDB</div>
            <span class="db-status planned">Planned</span>
          </div>
          <div class="db-card text-decoration-none opacity-75">
            <div class="db-icon" style="background:#ccfbf1;color:#0d9488;"><i class="bi bi-database"></i></div>
            <div class="db-name">PostgreSQL</div>
            <span class="db-status planned">Planned</span>
          </div>
        </div>

        <div class="mt-5">
          <h6 class="fw-bold text-muted mb-3">SUMMARY OVERVIEW</h6>
          <div class="row g-3">
            <div class="col-6 col-lg-3">
              <div class="stat-card">
                <div class="stat-icon green"><i class="bi bi-server"></i></div>
                <div>
                  <div class="stat-value" id="statTotal">0</div>
                  <div class="stat-label">Total MongoDB Servers</div>
                </div>
              </div>
            </div>
            <div class="col-6 col-lg-3">
              <div class="stat-card">
                <div class="stat-icon blue"><i class="bi bi-check-circle"></i></div>
                <div>
                  <div class="stat-value" id="statOnline">0</div>
                  <div class="stat-label">Online Servers</div>
                </div>
              </div>
            </div>
            <div class="col-6 col-lg-3">
              <div class="stat-card">
                <div class="stat-icon red"><i class="bi bi-x-circle"></i></div>
                <div>
                  <div class="stat-value" id="statOffline">0</div>
                  <div class="stat-label">Offline Servers</div>
                </div>
              </div>
            </div>
            <div class="col-6 col-lg-3">
              <div class="stat-card">
                <div class="stat-icon amber"><i class="bi bi-exclamation-triangle"></i></div>
                <div>
                  <div class="stat-value" id="statAlerts">0</div>
                  <div class="stat-label">Active Alerts</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/app.js"></script>
  <script>
    requireAuth();
    document.getElementById('sidebar-mount').innerHTML = renderSidebar('dashboard');
    document.getElementById('topbar-mount').innerHTML = renderTopbar('Dashboard');
    applyRoleVisibility();

    apiGetServers().then(servers => {
      const online = servers.filter(s => s.status === 'online').length;
      const offline = servers.filter(s => s.status === 'offline').length;
      const alerts = servers.filter(s => s.status === 'warning' || s.status === 'offline').length;
      document.getElementById('statTotal').textContent = servers.length;
      document.getElementById('statOnline').textContent = online;
      document.getElementById('statOffline').textContent = offline;
      document.getElementById('statAlerts').textContent = alerts;
    });
  </script>
</body>
</html>
