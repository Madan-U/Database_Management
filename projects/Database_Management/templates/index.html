<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB Inventory Platform — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="./css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <i class="bi bi-database-fill-gear"></i>
      </div>
      <h1 class="login-title">Database Inventory Platform</h1>
      <p class="login-subtitle">Centralized MongoDB inventory &amp; real-time monitoring</p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <div class="input-icon-group">
            <i class="bi bi-person"></i>
            <input type="text" class="form-control" id="username" placeholder="Enter username" autocomplete="username" required />
          </div>
          <div class="invalid-feedback">Please enter your username.</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-icon-group">
            <i class="bi bi-lock"></i>
            <input type="password" class="form-control" id="password" placeholder="Enter password" autocomplete="current-password" required />
            <button type="button" class="btn btn-link btn-sm position-absolute end-0 top-0 mt-1 me-2 p-0" id="togglePwd" style="color:var(--color-text-muted)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Please enter your password.</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" />
            <label class="form-check-label small" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="small" style="color:var(--color-primary)">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>

        <div id="loginError" class="alert alert-danger mt-3 py-2 d-none" role="alert"></div>
      </form>

      <div class="login-footer">
        <i class="bi bi-shield-lock"></i> Secured with bcrypt password hashing
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/app.js"></script>
  <script>
    // Redirect if already logged in
    if (getSession()) {
      window.location.href = './dashboard.html';
    }

    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      const icon = this.querySelector('i');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('loginError');
      const submitBtn = this.querySelector('button[type="submit"]');

      if (!username || !password) {
        this.classList.add('was-validated');
        return;
      }

      errorBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          // Cache the user for fast client-side UI gating (role visibility etc.)
          // Real authorization on every write is still enforced server-side via the session cookie.
          setSession({ name: data.name, role: data.role, username: data.username });
          window.location.href = './dashboard.html';
        } else {
          errorBox.textContent = data.error || 'Invalid username or password.';
          errorBox.classList.remove('d-none');
        }
      } catch (err) {
        errorBox.textContent = 'Could not reach the server. Please check the backend is running.';
        errorBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
      }
    });
  </script>
</body>
</html>
